name: pr_validation

on:
  push:
    branches:
      - master
      - dev
      - main
  pull_request:
    branches:
      - master
      - dev
      - main
      - feature/akka-1.6

jobs:
  test:
    name: Test-${{matrix.os}}
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.0
        with:
          lfs: true
          fetch-depth: 0

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Restore .NET tools"
        run: dotnet tool restore

      - name: "Update release notes"
        shell: pwsh
        run: |
          ./build.ps1

      - name: "dotnet build"
        run: dotnet build -c Release

      # .NET Framework tests can't run reliably on Linux, so we only do .NET 8

      - name: "dotnet test"
        shell: bash
        run: dotnet test -c Release 

      - name: "dotnet pack"
        run: dotnet pack -c Release -o ./bin/nuget

  aot-canary:
    name: Native AOT canary (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Independent of the test job so Native AOT has its own status check and still runs
    # when the regular build or tests fail. Covers local mode with in-memory and SQLite
    # storage, including recovery in a fresh process.
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Native AOT canary: publish"
        shell: bash
        run: |
          mkdir -p ./aot
          dotnet publish src/aot/Akka.Reminders.AOT.App -c Release -r linux-x64 -o ./aot/app 2>&1 | tee ./aot/publish.log
          exit ${PIPESTATUS[0]}

      - name: "Native AOT canary: check trim/AOT warnings"
        shell: bash
        run: src/aot/check-aot-warnings.sh ./aot/publish.log

      - name: "Native AOT canary: run"
        shell: bash
        run: ./aot/app/Akka.Reminders.AOT.App
