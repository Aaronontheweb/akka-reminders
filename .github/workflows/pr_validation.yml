name: pr_validation

on:
  push:
    branches:
      - master
      - dev
      - main
  pull_request:
    branches:
      - master
      - dev
      - main

jobs:
  test:
    name: Test-${{matrix.os}}
    runs-on: ${{matrix.os}}

    strategy:
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.0
        with:
          lfs: true
          fetch-depth: 0

      - name: "Install .NET SDK"
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: "./global.json"

      - name: "Restore .NET tools"
        run: dotnet tool restore

      - name: "Update release notes"
        shell: pwsh
        run: |
          ./build.ps1

      - name: "dotnet build"
        run: dotnet build -c Release

      # .NET Framework tests can't run reliably on Linux, so we only do .NET 8

      - name: "dotnet test"
        shell: bash
        run: dotnet test -c Release 

      # Native AOT canary: local reminders with Akka.DynamicTypeLoading off, in-memory and SQLite
      # storage, including a restart that restores a reminder from SQLite. Fails on any trim/AOT
      # warning from Akka.Reminders, or any warning missing from the baseline.
      - name: "Native AOT canary: publish"
        shell: bash
        run: |
          mkdir -p ./aot
          dotnet publish src/aot/Akka.Reminders.AOT.App -c Release -r linux-x64 -o ./aot/app 2>&1 | tee ./aot/publish.log
          exit ${PIPESTATUS[0]}

      - name: "Native AOT canary: check trim/AOT warnings"
        shell: bash
        run: src/aot/check-aot-warnings.sh ./aot/publish.log

      - name: "Native AOT canary: run"
        shell: bash
        run: ./aot/app/Akka.Reminders.AOT.App

      - name: "dotnet pack"
        run: dotnet pack -c Release -o ./bin/nuget